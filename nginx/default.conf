server {
    listen 80;
    server_name 3.35.188.218.nip.io;

    # Certbot 인증용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 3.35.188.218.nip.io;

    # SSL 인증서 경로 (발급 후 활성화)
    ssl_certificate /etc/letsencrypt/live/3.35.188.218.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.35.188.218.nip.io/privkey.pem;

    # 소셜 로그인 프록시 핵심 설정
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 443; # 소셜 로그인 리다이렉트 고정 위해 명시

    # Spring Boot 연결 (API 요청)
    location / {
        proxy_pass http://spring-api:8080;

        # --- 타임아웃 설정 ---
        proxy_connect_timeout 300s; # Spring과 연결을 맺는 시간
        proxy_send_timeout    300s; # Spring으로 데이터를 보내는 시간
        proxy_read_timeout    300s; # Spring으로부터 응답을 기다리는 시간 
    }
}