services:
    # 1. Nginx
    nginx:
        image: nginx:latest
        container_name: nginx
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        depends_on:
            - spring-api
        networks:
            - banolim-network

    # 2. Certbot
    certbot:
        image: certbot/certbot
        container_name: certbot
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
        networks:
            - banolim-network

    # 3. Spring Boot
    spring-api:
        image: ${DOCKER_HUB_USERNAME}/banolim-spring:latest
        container_name: spring-api
        restart: always
        environment:
            - SPRING_PROFILES_ACTIVE=prod
            - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME}

            # Database (PostgreSQL)
            - SPRING_DATASOURCE_URL=${DEPLOY_DB_URL}
            - SPRING_DATASOURCE_USERNAME=${DEPLOY_DB_USERNAME}
            - SPRING_DATASOURCE_PASSWORD=${DEPLOY_DB_PASSWORD}
            - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
            - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM}
            - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
            - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
            - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}

            # Security & JWT
            - JWT_SECRET=${JWT_SECRET}
            - JWT_EXPIRATION=${JWT_EXPIRATION}

            # Frontend & API
            - APP_FRONTEND_URL=${FRONTEND_URL}
            - FRONTEND_URL=${FRONTEND_URL}
            - FASTAPI_BASE_URL=${FASTAPI_BASE_URL}
            - FASTAPI_TIMEOUT_MS=${FASTAPI_TIMEOUT_MS}

            # Social Login (Kakao)
            - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
            - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
            - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}

            # AWS S3
            - SPRING_CLOUD_AWS_REGION_STATIC=${AWS_REGION}
            - APP_AWS_S3_BUCKET=${AWS_S3_BUCKET}
            - AWS_S3_BUCKET=${AWS_S3_BUCKET}
            - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

            # Neo4j Graph DB
            - SPRING_NEO4J_URI=${NEO4J_URI}
            - SPRING_NEO4J_AUTHENTICATION_USERNAME=${NEO4J_USERNAME}
            - SPRING_NEO4J_AUTHENTICATION_PASSWORD=${NEO4J_PASSWORD}

        depends_on:
            - fastapi-ai
        networks:
            - banolim-network

    # 4. FastAPI
    fastapi-ai:
        image: ${DOCKER_HUB_USERNAME}/banolim-ai:latest
        container_name: fastapi-ai
        restart: always
        environment:
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - CLAUDE_API_KEY=${CLAUDE_API_KEY}
            - CHATBOT_ELEVENLABS_API_KEY=${CHATBOT_ELEVENLABS_API_KEY}
            - SENTENCE_ELEVENLABS_API_KEY=${SENTENCE_ELEVENLABS_API_KEY}
            - WORDBOOK_OPENAI_API_KEY=${WORDBOOK_OPENAI_API_KEY}
            - AWS_REGION=${AWS_REGION}
            - AWS_S3_BUCKET=${AWS_S3_BUCKET}
        networks:
            - banolim-network

networks:
    banolim-network:
        driver: bridge
